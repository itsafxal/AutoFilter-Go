services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: mytgbotz:latest
    container_name: mytgbotz_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - OWNER_ID=${OWNER_ID}
      - ADMINS=${ADMINS}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
