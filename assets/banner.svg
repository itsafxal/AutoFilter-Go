<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#031525" />
    </linearGradient>

    <!-- Brand Vibrant Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#38bdf8;#818cf8;#00f2fe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#00f2fe;#38bdf8;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Cyan-Blue Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 64px;
      letter-spacing: -1.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .code-accent {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      fill: #38bdf8;
    }
  </style>

  <!-- Deep Background Container -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="20" fill="url(#grid)" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="150" cy="180" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="180" r="160" fill="#7c3aed" opacity="0.10" filter="url(#glow)" />

  <!-- Outer Border Frame with Glowing Accent -->
  <rect x="2" y="2" width="1196" height="356" rx="18" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8" />
  <rect x="2" y="2" width="1196" height="356" rx="18" fill="none" stroke="url(#textGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- ================= LEFT BRAND ICON ================= -->
  <g transform="translate(70, 70)">
    <!-- Rotating Ring -->
    <circle cx="110" cy="110" r="85" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0 110 110" to="360 110 110" dur="30s" repeatCount="indefinite" />
    </circle>
    <circle cx="110" cy="110" r="72" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 6" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="360 110 110" to="0 110 110" dur="20s" repeatCount="indefinite" />
    </circle>

    <!-- Shield/Backdrop -->
    <rect x="25" y="25" width="170" height="170" rx="36" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <rect x="25" y="25" width="170" height="170" rx="36" fill="none" stroke="url(#textGrad)" stroke-width="2" stroke-opacity="0.5" />

    <!-- Filter Funnel -->
    <g filter="url(#softGlow)">
      <path d="M60 62 L160 62 L125 110 L125 152 L95 162 L95 110 Z" 
            fill="none" 
            stroke="url(#textGrad)" 
            stroke-width="7" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      
      <!-- Lightning Bolt / Fast Speed Symbol -->
      <path d="M115 72 L96 102 L112 102 L105 138 L128 106 L112 106 Z" 
            fill="#38bdf8">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="1.8s" repeatCount="indefinite" />
      </path>
      
      <!-- Micro Circuit Nodes -->
      <circle cx="60" cy="62" r="4.5" fill="#38bdf8" />
      <circle cx="160" cy="62" r="4.5" fill="#a855f7" />
      <circle cx="95" cy="162" r="3.5" fill="#38bdf8" />
    </g>
  </g>

  <!-- ================= CENTER & RIGHT CONTENT ================= -->
  <g transform="translate(320, 0)">
    <!-- Version Tag Pill -->
    <g transform="translate(0, 52)">
      <rect width="190" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="19" class="code-accent" font-size="12px">v2.0 • Go 1.25+ Ready</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" class="title-text" fill="url(#textGrad)" filter="url(#softGlow)">AutoFilter-Go</text>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle-text">High-Performance Telegram MTProto Media Indexer &amp; Search Engine</text>

    <!-- Animated Accent Line -->
    <line x1="0" y1="202" x2="680" y2="202" stroke="#1e293b" stroke-width="2" />
    <line x1="0" y1="202" x2="220" y2="202" stroke="url(#textGrad)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" values="0;460;0" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="220;680;220" dur="6s" repeatCount="indefinite" />
    </line>

    <!-- Technology Feature Badges / Pills -->
    <g transform="translate(0, 230)">
      <!-- Badge 1: Gogram MTProto -->
      <g transform="translate(0, 0)">
        <rect width="165" height="34" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6" />
        <text x="12" y="22" class="badge-text">⚡ Gogram MTProto</text>
      </g>

      <!-- Badge 2: Multi-Cluster MongoDB -->
      <g transform="translate(177, 0)">
        <rect width="185" height="34" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
        <text x="12" y="22" class="badge-text">🍃 Multi-Cluster Mongo</text>
      </g>

      <!-- Badge 3: SQLite WAL Index -->
      <g transform="translate(374, 0)">
        <rect width="170" height="34" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6" />
        <text x="12" y="22" class="badge-text">⚡ Pure-Go SQLite WAL</text>
      </g>

      <!-- Badge 4: Stream Engine -->
      <g transform="translate(556, 0)">
        <rect width="165" height="34" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1" stroke-opacity="0.6" />
        <text x="12" y="22" class="badge-text">🌐 HTTP Stream Server</text>
      </g>
    </g>

    <!-- Secondary Meta Row -->
    <g transform="translate(0, 286)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13px" fill="#64748b">
        Sub-millisecond Search • Sharded DB2/DB3 Storage • 3-Tier FSub • Docker Multi-Stage • Auto-Trash Cleanup
      </text>
    </g>
  </g>
</svg>

