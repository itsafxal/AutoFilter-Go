<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded hexagon/shield -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="192" height="192" rx="40" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Outer Ring Elements -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="25s" repeatCount="indefinite" />
  </circle>

  <!-- Filter Funnel & Lightning / Search Icon -->
  <g filter="url(#glow)">
    <!-- Stylized Funnel -->
    <path d="M55 60 L145 60 L115 102 L115 142 L85 152 L85 102 Z" 
          fill="none" 
          stroke="url(#glowGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Central Fast Energy Bolt -->
    <path d="M104 70 L88 96 L102 96 L96 125 L116 98 L102 98 Z" 
          fill="#38bdf8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
    </path>
    
    <!-- Modern Tech Nodes -->
    <circle cx="55" cy="60" r="4" fill="#38bdf8" />
    <circle cx="145" cy="60" r="4" fill="#38bdf8" />
    <circle cx="100" cy="155" r="3" fill="#818cf8" />
  </g>
</svg>

